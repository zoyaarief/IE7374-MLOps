name: Lab 03 - Wine Model Pipeline

on:
  push:
    branches: [main]
    paths:
      - "lab_03/**"
      - ".github/workflows/lab_03_model_pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "lab_03/**"
      - ".github/workflows/lab_03_model_pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: lab_03/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lab_03/requirements.txt

      - name: Run automated tests
        run: python -m pytest lab_03/test -v

      - name: Train and version model
        id: train
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from lab_03.src.train_model import train_model

          model_path, report_path = train_model()
          version = model_path.stem.removeprefix("wine_model_")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"model_path={model_path}\n")
              output.write(f"training_report_path={report_path}\n")
              output.write(f"version={version}\n")
          PY

      - name: Evaluate this run's model
        env:
          MODEL_PATH: ${{ steps.train.outputs.model_path }}
        run: python lab_03/src/evaluate_model.py --model "$MODEL_PATH"

      - name: Upload versioned model and reports
        uses: actions/upload-artifact@v7
        with:
          name: lab-03-wine-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.train.outputs.model_path }}
            ${{ steps.train.outputs.training_report_path }}
            lab_03/metrics/evaluation_${{ steps.train.outputs.version }}.json
            lab_03/requirements.txt
          if-no-files-found: error
          retention-days: 90
